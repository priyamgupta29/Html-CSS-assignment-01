<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Task 41: Responsive page featuring two distinct CSS media query breakpoints.">
    <title>Task 41 – Breakpoints Testing</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f8fafc; color: #0f172a; margin: 0; padding: 1.5rem; }
        .responsive-box {
            background: #2563eb;
            color: white;
            padding: 2rem;
            text-align: center;
            border-radius: 8px;
            font-size: 1.25rem;
            font-weight: bold;
        }
        /* Breakpoint 1: Tablet (768px) */
        @media (min-width: 768px) {
            .responsive-box { background: #059669; }
        }
        /* Breakpoint 2: Desktop (1024px) */
        @media (min-width: 1024px) {
            .responsive-box { background: #7c3aed; max-width: 800px; margin: 0 auto; }
        }
    </style>
</head>
<body>
    <div class="responsive-box">
        Resize window to test breakpoints (Mobile: Blue, Tablet: Green, Desktop: Purple)
    </div>
</body>
</html>
