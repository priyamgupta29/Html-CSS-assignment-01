<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Task 39: Grid layout with header, sidebar, and product grid.">
    <title>Task 39 – Storefront Layout</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f8fafc; color: #0f172a; margin: 0; padding: 1rem; }
        .store-layout {
            display: grid;
            grid-template-columns: 220px 1fr;
            grid-template-rows: auto 1fr;
            gap: 1.5rem;
            max-width: 1100px;
            margin: 0 auto;
        }
        .store-header { grid-column: 1 / -1; background: #ffffff; padding: 1rem 1.5rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1.25rem; font-weight: bold; color: #1e3a8a; }
        .store-sidebar { background: #ffffff; padding: 1.25rem; border: 1px solid #cbd5e1; border-radius: 8px; height: fit-content; }
        .store-main { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
        .card { background: #ffffff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 1rem; text-align: center; }
        .card h4 { margin: 0.5rem 0; color: #2563eb; }
        @media (max-width: 768px) {
            .store-layout { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="store-layout">
        <header class="store-header">TechCatalog Storefront</header>
        <aside class="store-sidebar">
            <h3>Categories</h3>
            <p>Hardware<br>Peripherals<br>Accessories</p>
        </aside>
        <main class="store-main">
            <div class="card"><h4>Item Alpha</h4><p>$50.00</p></div>
            <div class="card"><h4>Item Beta</h4><p>$75.00</p></div>
            <div class="card"><h4>Item Gamma</h4><p>$100.00</p></div>
        </main>
    </div>
</body>
</html>
