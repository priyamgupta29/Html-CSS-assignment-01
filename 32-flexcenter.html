<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Assignment 32: Demonstrating main and cross-axis alignment using Flexbox.">
  <title>Aarav Sharma – Assignment 32: Flex Alignment</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      font-family: system-ui, sans-serif;
      padding: 1rem;
      color: #0f172a;
    }

    /* Main Dashboard Card Container */
    .dashboard-card {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .card-header h1 {
      margin: 0 0 0.25rem 0;
      font-size: 1.5rem;
      color: #1e3a8a;
    }

    .card-header p {
      margin: 0;
      color: #64748b;
      font-size: 0.95rem;
    }

    /* ==========================================
       ASSIGNMENT 32 CORE: FLEX ALIGNMENT ROW
       ========================================== */
    .alignment-toolbar {
      display: flex;
      /* Main Axis Distribution */
      justify-content: space-between; 
      /* Cross Axis Centering */
      align-items: center; 
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      padding: 1.25rem;
      border-radius: 10px;
    }

    .toolbar-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      background-color: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 0 4px #d1fae5;
    }

    .toolbar-info span {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .toolbar-actions {
      display: flex;
      gap: 0.5rem;
    }

    /* Button Styling */
    .btn-secondary {
      background: #e2e8f0;
      color: #334155;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-secondary:hover {
      background: #cbd5e1;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    /* Footer Note Box */
    .assignment-note {
      background: #eff6ff;
      border-left: 4px solid #2563eb;
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      color: #1e40af;
      border-radius: 0 6px 6px 0;
    }
  </style>
</head>

<body>

  <main class="dashboard-card">
    <div class="card-header">
      <h1>Task 32: Flex Alignment</h1>
      <p>Module 7: Main &amp; Cross-Axis Control</p>
    </div>

    <!-- Alignment Toolbar demonstrating justify-content and align-items -->
    <div class="alignment-toolbar">
      <div class="toolbar-info">
        <div class="status-dot"></div>
        <span>System Active</span>
      </div>
      <div class="toolbar-actions">
        <button class="btn-secondary" type="button">Edit</button>
        <button class="btn-primary" type="button">Deploy</button>
      </div>
    </div>

    <div class="assignment-note">
      <strong>Property Focus:</strong> <code>justify-content: space-between</code> spreads items horizontally across the main axis, while <code>align-items: center</code> perfectly aligns them vertically along the cross axis.
    </div>
  </main>

</body>

</html>
