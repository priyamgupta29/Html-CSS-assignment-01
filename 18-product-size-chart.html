<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Size Chart</title>
    <style>
        table { border-collapse: collapse; width: 50%; margin-top: 20px; }
        th, td { border: 1px solid #cbd5e1; padding: 10px; text-align: center; }
        th { background-color: #f1f5f9; }
    </style>
</head>
<body>
    <h1>Clothing Size Guide</h1>
    <table>
        <caption>Standard Unisex T-Shirt Measurements (Inches)</caption>
        <thead>
            <tr>
                <th>Size</th>
                <th>Chest</th>
                <th>Length</th>
                <th>Sleeve</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>S</td>
                <td>36 - 38"</td>
                <td>27"</td>
                <td>8"</td>
            </tr>
            <tr>
                <td>M</td>
                <td>40 - 42"</td>
                <td>28"</td>
                <td>8.5"</td>
            </tr>
            <tr>
                <td>L</td>
                <td>44 - 46"</td>
                <td>29"</td>
                <td>9"</td>
            </tr>
            <tr>
                <td>XL</td>
                <td>48 - 50"</td>
                <td>30"</td>
                <td>9.5"</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
