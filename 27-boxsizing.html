<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 27 – Box Sizing</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #f7f7f7;
            color: #333;
            max-width: 600px;
            margin: 2rem auto;
            padding: 1rem;
        }
        /* Global Border-Box Reset Rule */
        *, *::before, *::after {
            box-sizing: border-box;
        }
        .box-container {
            width: 100%;
            background: #ffffff;
            border: 1px solid #ccc;
            padding: 2rem; /* Will not break 100% layout width with border-box */
            margin-top: 1rem;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <h1>Task 27: Box Sizing (Border-Box)</h1>
    <p>Using <code>box-sizing: border-box</code> includes padding and borders inside the total defined element width.</p>
    
    <div class="box-container">
        <p>This container has 100% width and 2rem padding, but it will not overflow its parent container because of border-box sizing.</p>
    </div>
</body>
</html>
