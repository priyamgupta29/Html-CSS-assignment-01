<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 23 – Font Pairing</title>
    <!-- Google Fonts: Poppins (Headings) & Inter (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif; /* Body font pairing */
            background-color: #f8fafc;
            color: #0f172a;
            max-width: 700px;
            margin: 3rem auto;
            padding: 0 1.5rem;
            line-height: 1.6;
        }
        h1, h2 {
            font-family: 'Poppins', sans-serif; /* Heading font pairing */
            color: #2563eb;
        }
    </style>
</head>
<body>
    <h1>Task 23: Font Pairing</h1>
    <h2>Heading using Poppins</h2>
    <p>This body paragraph is rendered using the Inter font family, offering clean legibility and modern technical aesthetics for user interfaces.</p>
</body>
</html>
