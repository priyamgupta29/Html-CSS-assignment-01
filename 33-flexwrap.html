<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Task 33: Practicing flex-wrap for multi-row layouts.">
    <title>Task 33 – Flex Wrap</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.6;
            color: #333;
            background: #f7f7f7;
            max-width: 700px;
            margin: 0 auto;
            padding: 1.5rem;
        }
        h1 { color: #2a5db0; }

        .flex-container {
            display: flex;
            flex-wrap: wrap; /* Allows items to wrap onto multiple rows */
            gap: 1rem;
            background: #ffffff;
            padding: 1.5rem;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .flex-item {
            flex: 1 1 180px; /* Grow, shrink, and base width */
            background: #e2e8f0;
            color: #1e3a8a;
            padding: 1.5rem;
            text-align: center;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Task 33: Flex Wrap</h1>
    <p>Using <code>flex-wrap: wrap</code> so cards wrap cleanly when screen width narrows.</p>
    
    <div class="flex-container">
        <div class="flex-item">Card One</div>
        <div class="flex-item">Card Two</div>
        <div class="flex-item">Card Three</div>
        <div class="flex-item">Card Four</div>
    </div>
</body>
</html>
