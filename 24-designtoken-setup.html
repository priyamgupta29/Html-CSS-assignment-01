<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 24 – Design Tokens</title>
    <style>
        /* Design Tokens Configuration */
        :root {
            --color-primary: #2563eb;
            --color-bg: #f8fafc;
            --color-surface: #ffffff;
            --color-text: #0f172a;
            --spacing-unit: 1.5rem;
            --border-radius: 8px;
        }

        body {
            font-family: system-ui, sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text);
            margin: 2rem;
        }

        .token-box {
            background-color: var(--color-surface);
            padding: var(--spacing-unit);
            border: 1px solid var(--color-primary);
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        h1 { color: var(--color-primary); margin-top: 0; }
    </style>
</head>
<body>
    <div class="token-box">
        <h1>Task 24: Design Tokens</h1>
        <p>This element is styled entirely using CSS variables defined in the <code>:root</code> block.</p>
    </div>
</body>
</html>
