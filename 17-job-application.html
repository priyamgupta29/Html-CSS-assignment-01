<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Job Application Form</title>
</head>
<body>
    <h1>Job Application Portal</h1>
    <form action="#" method="POST">
        <!-- Text & Contact Inputs -->
        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="applicant-email">Email:</label><br>
        <input type="email" id="applicant-email" name="email" required><br><br>

        <label for="phone">Phone Number:</label><br>
        <input type="tel" id="phone" name="phone"><br><br>

        <label for="dob">Date of Birth:</label><br>
        <input type="date" id="dob" name="dob"><br><br>

        <!-- Dropdown Select -->
        <label for="position">Applying For Role:</label><br>
        <select id="position" name="position">
            <option value="frontend">Frontend Developer</option>
            <option value="backend">Backend Developer</option>
            <option value="fullstack">Full Stack Engineer</option>
        </select><br><br>

        <!-- Radio Buttons -->
        <label>Employment Type:</label><br>
        <input type="radio" id="fulltime" name="emptype" value="fulltime">
        <label for="fulltime">Full-Time</label>
        <input type="radio" id="parttime" name="emptype" value="parttime">
        <label for="parttime">Part-Time</label><br><br>

        <!-- Checkboxes -->
        <label>Programming Languages Known:</label><br>
        <input type="checkbox" id="html" name="skills" value="html">
        <label for="html">HTML/CSS</label>
        <input type="checkbox" id="js" name="skills" value="js">
        <label for="js">JavaScript</label><br><br>

        <!-- File Upload -->
        <label for="resume">Upload Resume:</label><br>
        <input type="file" id="resume" name="resume"><br><br>

        <!-- Range & Color -->
        <label for="experience">Years of Experience (0-10):</label><br>
        <input type="range" id="experience" name="experience" min="0" max="10"><br><br>

        <label for="favcolor">Favorite Theme Color:</label><br>
        <input type="color" id="favcolor" name="favcolor" value="#2563eb"><br><br>

        <!-- Textarea -->
        <label for="coverletter">Cover Letter:</label><br>
        <textarea id="coverletter" name="coverletter" rows="4" cols="40"></textarea><br><br>

        <!-- Submit Button -->
        <button type="submit">Submit Application</button>
    </form>
</body>
</html>
