<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Task 40: Comprehensive grid-based portfolio dashboard showcase.">
    <title>Task 40 – Grid Project Capstone</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f1f5f9; color: #0f172a; margin: 0; padding: 1.5rem; }
        .grid-capstone {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            max-width: 1100px;
            margin: 0 auto;
        }
        .card-main { grid-column: span 2; background: #ffffff; padding: 2rem; border-radius: 12px; border: 1px solid #cbd5e1; }
        .card-side { background: #ffffff; padding: 2rem; border-radius: 12px; border: 1px solid #cbd5e1; }
        h1 { color: #1e3a8a; margin-top: 0; }
        .badge { display: inline-block; background: #dbeafe; color: #1e40af; padding: 0.25rem 0.75rem; border-radius: 999px; font-weight: 600; font-size: 0.85rem; margin-top: 1rem; }
    </style>
</head>
<body>
    <main class="grid-capstone">
        <section class="card-main">
            <h1>Module 8 Grid Capstone Project</h1>
            <p>This layout highlights advanced fractional sizing and macro-structural grid distribution across multiple viewports.</p>
            <div class="badge">Grid Mastered Successfully ✔</div>
        </section>
        <section class="card-side">
            <h3>Quick Stats</h3>
            <p><strong>Tasks Completed:</strong> 40 / 45</p>
            <p><strong>Status:</strong> Verified</p>
        </section>
    </main>
</body>
</html>
